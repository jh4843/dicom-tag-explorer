# 빌드 시 gen_notices가 대조하는 라이선스 승인 대장 (Spec v0.1.0 3.2, THIRD_PARTY_LICENSES.md와 함께 갱신).
# meta는 gen_notices.meta_license()가 만드는 문자열과 정확히 같아야 한다. 다르면 재확인이 필요하므로 빌드가 실패한다.

[policy]
allowed_verdicts = ["허용", "허용 (빌드 도구)", "조건부(LGPL)", "조건부(미수정)", "조건부(EULA)"]
allowed_spdx = [
    "MIT", "MIT-CMU", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "Apache-2.0", "ISC", "Zlib", "PSF-2.0",
    "MS-PL", "HPND", "Unlicense", "CC0-1.0",
    "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
]
# 판정이 일치할 때만 허용하는 라이선스 (LIC-01, LIC-03)
conditional_spdx = { "MPL-2.0" = "조건부(미수정)", "LicenseRef-Microsoft-Distributable-Code" = "조건부(EULA)" }
allowed_exceptions = ["GCC-exception-3.1", "LicenseRef-PyInstaller-Bootloader-exception"]
# 번들 허용 Qt 모듈 (Qt6{이름}.dll). Charts, DataVisualization, VirtualKeyboard 등 GPL 전용 모듈 혼입 방지
allowed_qt_modules = ["Core", "Gui", "Widgets", "Svg"]
# LIC-02: FreeType(FTL 선택) 크레딧. 문구는 FTL 원문(docs/FTL.TXT)과 같고, <year>는 번들 FreeType의 저작권 연도 2025이다.
# 확인: Qt 6.11.0 번들 FreeType 2.14.2, Pillow 12.1.1 번들 FreeType 2.14.1(2025-09-11 배포, 소스 저작권 1996-2025) 모두 2025.
freetype_credit = "Portions of this software are copyright © 2025 The FreeType Project (https://freetype.org). All rights reserved."

